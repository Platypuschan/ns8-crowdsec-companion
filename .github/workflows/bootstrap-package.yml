name: Bootstrap GHCR package

# Creates the ghcr.io/platypuschan/crowdsec-companion package once, so its
# visibility can be set to public before the first real build. Removed again
# when the real publish workflow is added.
on:
  push:
    branches: [feat/companion-0.1]
    paths: [.github/workflows/bootstrap-package.yml]

permissions:
  contents: read
  packages: write

jobs:
  placeholder:
    runs-on: ubuntu-24.04
    steps:
      - name: Push placeholder image
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login -u "${{ github.actor }}" --password-stdin ghcr.io
          ctr=$(buildah from scratch)
          buildah config --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.description="Placeholder, not a usable module" "$ctr"
          buildah commit "$ctr" ghcr.io/platypuschan/crowdsec-companion:placeholder
          buildah push ghcr.io/platypuschan/crowdsec-companion:placeholder
